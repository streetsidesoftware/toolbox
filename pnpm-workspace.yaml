packages:
  - packages/*
  - internal/*
  - scripts

blockExoticSubdeps: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@cspell/*'
  - '@streetsidesoftware/*'
  - cspell
  - cspell-*
  - inject-markdown
  - '@lerna-lite/cli@5.8.0'
  - '@lerna-lite/core@5.8.0'
  - '@lerna-lite/init@5.8.0'
  - '@lerna-lite/publish@5.8.0'
  - '@lerna-lite/version@5.8.0'

nodeLinker: isolated

saveWorkspaceProtocol: rolling

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@5.7.2
