name: '🧹 Lint'

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: 26.x

      - name: Build
        run: pnpm run build

      - run: pnpm run lint-ci

      - name: Spell Check
        run: pnpm run spell
