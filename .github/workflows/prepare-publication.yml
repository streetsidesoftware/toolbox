name: '📦 Prepare a New Package for Publication'

# Opens a `feat:` PR for each private package waiting for publication: it makes the package public, sets its
# `release-as` to 1.0.0, and adds it to static/published.json. The PR's checklist has the maintainer's steps.
# A package is skipped when static/published.json marks it `false` or its PR is already open. An open PR is never
# rebuilt, since the maintainer commits to its branch; close it to have the next run rebuild it.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'static/published.json'
  workflow_dispatch:
    inputs:
      package:
        description: 'Only this package: its directory under packages/, such as unindent, or its name. Blank: all.'
        type: string
        required: false
      ref:
        description: 'Branch to run against and open the PR into'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REF_BRANCH: ${{ inputs.ref || 'main' }}

jobs:
  find:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.REF_BRANCH }}

      - uses: ./.github/actions/setup

      - name: Find packages waiting for publication
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
        run: pnpm exec publication-candidates --github-output "$PACKAGE"

  prepare-publication:
    needs: find
    if: needs.find.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.find.outputs.packages) }}
    env:
      PACKAGE_DIR: ${{ matrix.dir }}
      PACKAGE_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.REF_BRANCH }}

      - uses: ./.github/actions/setup

      - name: Prepare for publication
        run: |
          pnpm run prepare-publication "$PACKAGE_NAME"
          # Adds the now-public package to the root README's packages table.
          pnpm run build:readme

      - name: PR
        uses: ./.github/actions/pr
        with:
          commit-message: 'feat(${{ matrix.dir }}): publish ${{ matrix.name }}'
          branch: prepare-publication-${{ matrix.dir }}
          base: ${{ env.REF_BRANCH }}
          body: |
            Makes `${{ matrix.name }}` public: removes `private` and "-- Private until verified", sets its `release-as` to `1.0.0`, adds it to the packages table in the root `README.md`, and records it in `static/published.json` as waiting for publication (`{ "trustedPublishing": false }`).

            This PR stays as it is while it's open, so commits pushed to its branch are kept. To rebuild it from `main`, close it and run the workflow. To never publish the package, set its entry in `static/published.json` on `main` to `false` and close this PR.

            ### 1. Check out this branch

            ```sh
            git fetch origin prepare-publication-${{ matrix.dir }}
            git switch -C prepare-publication-${{ matrix.dir }} FETCH_HEAD
            ```

            Or with the GitHub CLI:

            ```sh
            gh pr checkout prepare-publication-${{ matrix.dir }} --detach
            ```

            ### 2. Publish the first version by hand

            From the repo root:

            - [ ] Log in to npm, then check that the last command shows your npm user name:
              ```sh
              npm login --auth-type=web
              npm whoami
              ```
            - [ ] Build and pack the package, then check the files under "Tarball Contents". `dist/` is gitignored and must be there. The README gets the Markdown sponsor links that npmjs.com can render, as in `publish.yml`; the last line undoes that:
              ```sh
              pnpm install
              pnpm run build
              cp static/sponsor-pub.md static/sponsor.md
              pnpm run build:readme
              cd packages/${{ matrix.dir }}
              pnpm pack --out package.tgz
              git checkout -- ../../static/sponsor.md README.md
              ```
            - [ ] Publish it as an alpha and add the trusted publisher. When npm opens the browser for 2FA, check the box to skip 2FA for the next 5 minutes, so `pnpm trusted-publishing` doesn't ask again:
              ```sh
              npm publish package.tgz --tag alpha --provenance=false
              rm package.tgz
              pnpm exec trusted-publishing
              ```

            ### 3. Commit the Trusted Publishing status

            `pnpm trusted-publishing` changes the package's entry in `static/published.json` to `{ "trustedPublishing": true }`:

            ```sh
            cd ../..
            git add static/published.json
            git commit -m "chore(${{ matrix.dir }}): record Trusted Publishing"
            git push origin HEAD:prepare-publication-${{ matrix.dir }}
            ```

            ### 4. Merge this PR

            Then merge the release PR. The [Publish to NPM](https://github.com/streetsidesoftware/toolbox/actions/workflows/publish.yml) workflow publishes `1.0.0` through Trusted Publishing. Then merge the PR that the [Update Release Please Config](https://github.com/streetsidesoftware/toolbox/actions/workflows/update-release-please-config.yml) workflow opens to remove `release-as`.
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
