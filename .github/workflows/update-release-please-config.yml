name: '⚙️ Update Release Please Config'

# Runs update-release-please-config, which adds new packages to release-please-config.json and
# .release-please-manifest.json, and drops each `release-as` whose version is now in the manifest.
# It also drops the entries of packages that no longer exist from the manifest and static/published.json.
# Opens a `chore:` PR with any change.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to run against and open the PR into'
        type: string
        default: main
  push:
    branches:
      - main
    paths:
      - .release-please-manifest.json
      - package.json
      - 'packages/*/package.json'
      - static/published.json

permissions:
  contents: read

# Each run regenerates from the newest main, so a newer run makes an older one pointless.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-release-please-config:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    env:
      REF_BRANCH: ${{ inputs.ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.REF_BRANCH }}

      - uses: ./.github/actions/setup

      - name: Update the Release Please config
        run: pnpm run release-please-config

      - name: PR
        uses: ./.github/actions/pr
        with:
          commit-message: 'chore: update the Release Please config'
          branch: release-please-config
          base: ${{ env.REF_BRANCH }}
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
