name: Bug report
description: Report a problem with one of the packages
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected (e.g. @streetsidesoftware/unindent)?
      placeholder: '@streetsidesoftware/unindent'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the package?
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal code snippet that reproduces the issue.
    validations:
      required: false
